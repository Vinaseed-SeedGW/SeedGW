# Máy chủ thử (staging) SeedGW. Chạy trên máy chủ nội bộ, Caddy tự lấy chứng chỉ HTTPS.
# Chạy từ thư mục gốc repo:
#   SEEDGW_ENV_FILE=/opt/seedgw/staging.env docker compose -f deploy/staging/docker-compose.yml -p seedgw-staging up -d --build
# Chỉ Caddy mở cổng ra ngoài (80, 443; 8080 chỉ trong máy cho Cloudflare Tunnel). Database, Redis, MinIO chỉ nằm trong mạng nội bộ của Docker.

x-app-env: &app-env
  env_file: ${SEEDGW_ENV_FILE:-./staging.env}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    <<: *app-env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data

  minio:
    image: cgr.dev/chainguard/minio:latest
    # Image mặc định chạy user không có quyền ghi vào volume mới tạo.
    user: root
    restart: unless-stopped
    command: server /data
    <<: *app-env
    volumes:
      - minio-data:/data

  # Chạy migration rồi thoát. Web chỉ khởi động sau khi migration xong.
  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: tools
      args:
        APP_VERSION: ${APP_VERSION:-staging}
    image: seedgw-tools:staging
    <<: *app-env
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: web
      args:
        APP_VERSION: ${APP_VERSION:-staging}
    image: seedgw-web:staging
    restart: unless-stopped
    <<: *app-env
    environment:
      OSRM_URL: http://osrm:5000
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      redis:
        condition: service_started

  worker:
    image: seedgw-tools:staging
    restart: unless-stopped
    <<: *app-env
    command: ['pnpm', '--filter', '@seedgw/worker', 'exec', 'tsx', 'src/index.ts']
    environment:
      OSRM_URL: http://osrm:5000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # R4: máy chủ tìm đường OSRM, bản đồ OpenStreetMap Việt Nam, cách tính đường xe máy. Chỉ trong mạng nội bộ
  # Docker, không mở cổng ra ngoài. Dữ liệu tạo bằng deploy/osrm/prepare.sh, cập nhật hằng tháng.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    command:
      [
        'osrm-routed',
        '--algorithm',
        'mld',
        '--max-matching-size',
        '1000',
        '/data/vietnam-latest.osrm',
      ]
    volumes:
      - ../osrm/data:/data:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    <<: *app-env
    ports:
      - '80:80'
      - '443:443'
      # Chỉ trong máy, cho cloudflared nối vào khi thử trên máy cá nhân.
      - '127.0.0.1:8080:8080'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
