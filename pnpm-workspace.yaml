packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  # Bản tăng tốc gốc C của msgpackr (bullmq kéo vào); không có thì msgpackr dùng bản JS.
  msgpackr-extract: false
  prisma: true
  sharp: true

# D6 (25/11/2026): nâng bản vá lỗ hổng cho thư viện gián tiếp, chỉ trong cùng đời phiên bản.
overrides:
  postcss@<8.5.23: ^8.5.23
  effect@<3.22.1: ^3.22.1
