# Tên dự án Docker cố định, không phụ thuộc tên thư mục repo.
name: seedgw

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: seedgw
      POSTGRES_PASSWORD: seedgw_dev_password
      POSTGRES_DB: seedgw
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'

  minio:
    # MinIO da ngung phat hanh image cong khai tren Docker Hub va Quay.
    image: cgr.dev/chainguard/minio:latest
    # Image mac dinh chay user khong co quyen ghi vao volume moi tao.
    user: root
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-seedgw}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-seedgw_dev_password}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  minio-data:
